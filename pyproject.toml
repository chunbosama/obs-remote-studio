[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obs-remote-studio"
version = "0.1.0"
description = "OBS Studio 远程控制客户端（基于 obs-websocket v5 / PySide6）"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "obsws-python>=1.6",
]

[project.optional-dependencies]
dev = [
    "websockets>=12.0",   # 仅用于测试中的假 OBS 服务器
    "pytest>=8.0",
]

[project.scripts]
obs-remote-studio = "obs_remote_studio.app:main"

[tool.setuptools.packages.find]
where = "src"

[tool.setuptools.package-data]
"obs_remote_studio.ui.resources" = ["*.qss"]

[tool.ruff]
line-length = 100
